[package]
name = "omakeep-helper"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
# Keeps url's IDNA on its small backend, about 20 crates fewer than ICU, with the same URL results.
idna_adapter = "=1.1.0"
miniz_oxide = "0.8"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "serialize", "limits", "hooks"] }
rustix = { version = "1", features = ["fs", "process", "rand", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
